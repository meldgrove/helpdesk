# Production on a Linux server (Debian, Ubuntu) with Docker Compose: the
# release image as two processes, the web app (`web`) and the worker
# (`worker`, sends emails and Slack messages, syncs the directory), after a
# one-off migration, plus the `updater` for automatic updates. Settings live
# in .env next to this file:
#
#   cp .env.example .env    # then set the production values (docs/configuration.md)
#   docker compose up -d --pull always
#
# HELPDESK_VERSION in .env selects the release of ghcr.io/meldgrove/helpdesk:
# a version such as 0.1.0, or a series such as 0.1. With automatic updates
# (docs/deployment.md, Automatic updates), the server writes each version it
# installs there. To upgrade by hand, read the release notes, change it, and
# run `docker compose up -d --pull always` again.
#
# Without a PostgreSQL of your own, add compose.postgres.yaml
# (COMPOSE_FILE=compose.yaml:compose.postgres.yaml in .env).
#
# `web` listens on 127.0.0.1:3000 (HELPDESK_PORT changes the host port), for a
# reverse proxy on the same server, such as Caddy, that terminates HTTPS; set
# APP_URL to its public https URL. Uploaded files live in the `attachments`
# volume: back it up with the database. On Coolify, use compose.coolify.yaml
# (docs/coolify.md).

x-image: &image ghcr.io/meldgrove/helpdesk:${HELPDESK_VERSION:?Set HELPDESK_VERSION to a release, e.g. 0.1.0}

# Every variable in .env reaches the containers (docs/configuration.md); the
# required ones are checked here so a missing value stops the start.
x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  APP_URL: ${APP_URL:?Set APP_URL}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
  OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
  # The reverse proxy in front of the app sets X-Forwarded-For.
  TRUST_PROXY: ${TRUST_PROXY:-true}
  # The update button of superadmins asks the `updater` service; an empty
  # UPDATER_URL gets this default too. With UPDATER_TOKEN (openssl rand -hex
  # 32), the app sends it, and the updater takes only requests that carry it.
  UPDATER_URL: ${UPDATER_URL:-http://updater:8080}
  UPDATER_TOKEN: ${UPDATER_TOKEN:-}

x-app: &app
  image: *image
  env_file:
    - path: .env
      required: false
  environment: *app-environment

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  web:
    <<: *app
    command: ["web"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - attachments:/data/attachments
    ports:
      # Only on the server itself, for the reverse proxy. HELPDESK_PORT picks
      # another host port when 3000 is taken, e.g. by another app.
      - "127.0.0.1:${HELPDESK_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/-/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The worker touches the file every few seconds while it runs.
      test:
        - CMD
        - node
        - -e
        - "const s = require('node:fs').statSync('/tmp/worker-heartbeat', { throwIfNoEntry: false }); process.exit(s && Date.now() - s.mtimeMs < 60000 ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Automatic updates and the superadmins' update button (docs/deployment.md):
  # installs nothing until the server runs `updater host-setup`. Then
  # superadmins choose Stable or Preview in the app, and for each installation
  # the server writes the version into HELPDESK_VERSION, pulls it, runs
  # `docker compose up --wait`, and goes back to the version before when it
  # does not become healthy. Its API (port 8080) is only for the app: never
  # publish it.
  updater:
    image: ghcr.io/meldgrove/updater:0.2
    restart: unless-stopped
    environment:
      IMAGE: *image
      # The server writes the installed version into this variable in .env.
      VERSION_VARIABLE: HELPDESK_VERSION
      # The app's UPDATER_TOKEN; empty: the API takes requests without one.
      API_TOKEN: ${UPDATER_TOKEN:-}
      # A stable release installs once it has been out this long, and only
      # inside the window, if one is set (e.g. 02:00-05:00, in the time zone TZ).
      COOLDOWN: ${UPDATE_COOLDOWN:-3d}
      WINDOW: ${UPDATE_WINDOW:-}
      TZ: ${TZ:-UTC}
      # Only while the image is private: a GitHub user and a token with
      # read:packages.
      REGISTRY_USERNAME: ${UPDATE_REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${UPDATE_REGISTRY_PASSWORD:-}
    volumes:
      - updater:/trigger

  # Backups for Meldgrove Backups (docs/deployment.md#backups): the database and
  # the `attachments` volume, sent when Backups asks. Idle while BACKUP_URL is
  # empty; it only reads and opens no port.
  backup-agent:
    image: ghcr.io/meldgrove/backup-agent:0.1
    restart: unless-stopped
    # The app's user, so that the agent reads every file the app writes.
    user: "1000:1000"
    environment:
      # From the app's source in Meldgrove Backups. Empty: the agent idles.
      BACKUP_URL: ${BACKUP_URL:-}
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      APP_NAME: helpdesk
      APP_IMAGE: *image
      # Settings a restore needs that are not in the backup (names only).
      APP_SECRETS: ENCRYPTION_KEY
    volumes:
      - attachments:/data/attachments:ro

volumes:
  attachments:
  updater:
