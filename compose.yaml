# Production setup: the release image as two processes, the web app (`web`)
# and the worker (`worker`, sends emails and Slack messages, syncs the
# directory), after a one-off migration.
#
#   cp .env.example .env    # then set the production values (docs/configuration.md)
#   docker compose up -d
#
# HELPDESK_VERSION in .env selects the release of ghcr.io/meldgrove/helpdesk,
# e.g. 0.1.0. `updater` installs new releases (docs/deployment.md, Automatic
# updates): on a Debian server it writes the installed version into
# HELPDESK_VERSION. To upgrade by hand, read the release notes, change it, and
# run `docker compose up -d` again. On a platform that does not pull images
# when it deploys, PULL_POLICY=always makes every start pull them again.
#
# Without a PostgreSQL of your own, add compose.postgres.yaml:
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d
#
# Put a TLS-terminating reverse proxy in front of port 3000 (HELPDESK_PORT
# changes the host port) and set APP_URL to its public https URL. Uploaded
# files live in the `attachments` volume: back it up with the database.

x-image: &image ghcr.io/meldgrove/helpdesk:${HELPDESK_VERSION:?Set HELPDESK_VERSION to a release, e.g. 0.1.0}

# Every variable in .env reaches the containers (docs/configuration.md); the
# required ones are checked here so a missing value stops the start.
x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  APP_URL: ${APP_URL:?Set APP_URL}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
  OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
  # The reverse proxy in front of the app sets X-Forwarded-For.
  TRUST_PROXY: ${TRUST_PROXY:-true}
  # The update button of superadmins asks the `updater` service.
  UPDATER_URL: ${UPDATER_URL:-http://updater:8080}

x-app: &app
  image: *image
  pull_policy: ${PULL_POLICY:-missing}
  env_file:
    - path: .env
      required: false
  environment: *app-environment

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  web:
    <<: *app
    command: ["web"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - attachments:/data/attachments
    ports:
      # The host port for a reverse proxy on the host. Platforms with their own
      # proxy (Coolify) reach `web` over the Docker network; set
      # HELPDESK_PORT to any free port when 3000 is taken.
      - "127.0.0.1:${HELPDESK_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/-/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The worker touches the file every few seconds while it runs.
      test:
        - CMD
        - node
        - -e
        - "const s = require('node:fs').statSync('/tmp/worker-heartbeat', { throwIfNoEntry: false }); process.exit(s && Date.now() - s.mtimeMs < 60000 ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Automatic updates and the superadmins' update button (docs/deployment.md):
  # installs nothing until UPDATE_DEPLOY_HOOK_URL is set (Coolify) or the
  # server watches the volume `updater` (Debian: `updater host-setup`). Then it
  # calls that deploy link or leaves a request in the volume, and Coolify or
  # the server deploys the new version. Its API (port 8080) is only for the
  # app: never publish it.
  updater:
    image: ghcr.io/meldgrove/updater:0.2
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      IMAGE: *image
      # Host mode writes the installed version into this variable in .env.
      VERSION_VARIABLE: HELPDESK_VERSION
      DEPLOY_HOOK_URL: ${UPDATE_DEPLOY_HOOK_URL:-}
      DEPLOY_HOOK_TOKEN: ${UPDATE_DEPLOY_HOOK_TOKEN:-}
      # A stable release installs once it has been out this long, and only
      # inside the window, if one is set (e.g. 02:00-05:00, in the time zone TZ).
      COOLDOWN: ${UPDATE_COOLDOWN:-3d}
      WINDOW: ${UPDATE_WINDOW:-}
      TZ: ${TZ:-UTC}
      # Only while the image is private: a GitHub user and a token with
      # read:packages.
      REGISTRY_USERNAME: ${UPDATE_REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${UPDATE_REGISTRY_PASSWORD:-}
    volumes:
      - updater:/trigger

volumes:
  attachments:
  updater:
