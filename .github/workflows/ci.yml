name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"

jobs:
  checks:
    name: Lint, types, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the schema
        run: |
          npm run db:generate -- --name ci-check
          if [ -n "$(git status --porcelain apps/server/drizzle)" ]; then
            git status --porcelain apps/server/drizzle
            echo "The schema in apps/server/src/db/schema has changes without a migration. Run: npm run db:generate"
            exit 1
          fi
      - run: npm run build
      # High and critical advisories in the production dependencies fail CI.
      # Those without a fix that do not affect the app are listed, with a
      # date, in the script.
      - run: node scripts/audit.mjs

  integration:
    name: Integration tests (PostgreSQL 18, Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk
        ports: ["55448:5432"]
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1028:1025", "8028:8025"]
    env:
      MAILPIT_API_URL: http://localhost:8028
      MAILPIT_SMTP_PORT: "1028"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration

  e2e:
    name: End-to-end with Keycloak
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: PostgreSQL, Keycloak and Mailpit
        run: docker compose -f compose.dev.yaml up -d
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8102/realms/helpdesk/.well-known/openid-configuration >/dev/null && exit 0
            sleep 2
          done
          docker compose -f compose.dev.yaml logs keycloak
          exit 1
      - run: npm run test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t helpdesk:ci .
      - name: The image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id helpdesk:ci -u)" = "1000"
      - name: The image excludes browser source maps
        run: docker run --rm --entrypoint sh helpdesk:ci -c 'maps=$(find apps/web/dist -type f -name "*.map") && test -z "$maps"'
      - name: The image starts its processes
        run: |
          docker run --rm --entrypoint node helpdesk:ci --import /app/apps/server/dist/instrument.mjs -e "process.exit(0)"
      - name: The image has the operator command
        run: |
          docker run --rm helpdesk:ci cli help | grep -q "cli settings apply"
          docker run --rm --entrypoint cli helpdesk:ci help | grep -q "cli settings apply"
